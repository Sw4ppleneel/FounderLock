<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Point a camera at a Plaksha founder. FounderLock recognises them on-device and pulls up their profile. Built by LEAP, the AI club at Plaksha." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>FounderLock | LEAP</title>
  </head>
  <body>
    <main id="stage" aria-label="Camera view">
      <video id="video" playsinline muted autoplay></video>
      <img id="still" alt="" hidden />
      <canvas id="hud"></canvas>
    </main>

    <header class="topbar">
      <button id="btn-home" class="brand" aria-label="Home">
        <img src="/leap-logo.svg" alt="LEAP" />
      </button>
      <span class="wordmark">FOUNDER<span class="slash">//</span>LOCK</span>
      <span id="status" class="status"><i></i><b>idle</b></span>
    </header>

    <aside id="card" class="card" aria-live="polite" hidden>
      <div class="grab" aria-hidden="true"></div>
      <div class="card-head">
        <div class="avatar"><img id="c-photo" alt="" /><span class="ring"></span></div>
        <div class="card-id">
          <span id="c-group" class="tag"></span>
          <h2 id="c-name"></h2>
          <span id="c-match" class="match"></span>
        </div>
        <button id="c-close" class="icon-btn" aria-label="Dismiss">✕</button>
      </div>
      <p id="c-role" class="role"></p>
      <p id="c-edu" class="edu"></p>
      <p id="c-bio" class="bio"></p>
      <nav id="c-links" class="links"></nav>
    </aside>

    <footer class="controls" hidden>
      <button id="btn-back" class="ctl" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg><span>Back</span>
      </button>
      <button id="btn-flip" class="ctl" aria-label="Switch camera">
        <svg viewBox="0 0 24 24"><path d="M4 7h11l-3-3M20 17H9l3 3" /></svg><span>Flip</span>
      </button>
      <button id="btn-live" class="ctl" aria-label="Back to camera" hidden>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" /><path d="M3 8V5h3M21 8V5h-3M3 16v3h3M21 16v3h-3" /></svg><span>Camera</span>
      </button>
      <label class="ctl" aria-label="Scan a photo">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2" /><path d="m3.5 16 5-5 4 4 3-3 5 5" /></svg><span>Photo</span>
        <input id="file" type="file" accept="image/*" hidden />
      </label>
    </footer>

    <section id="intro" class="intro">
      <div class="intro-inner">
        <a href="https://leap-aiclub.tech" target="_blank" rel="noopener"><img class="intro-logo" src="/leap-logo.svg" alt="LEAP" /></a>
        <h1>Point at a <span id="cycle" class="cycle">founder</span>.<br />We'll tell you who.</h1>
        <p class="sub" id="intro-sub">PLAKSHA FOUNDING MEMBERS · RECOGNISED ON-DEVICE · NOTHING UPLOADED</p>
        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
        <p class="progress-label" id="progress-label">loading models…</p>
        <div class="intro-actions">
          <button id="btn-start" class="primary" disabled>Start scanning</button>
          <label class="secondary">Scan a photo instead<input id="file-intro" type="file" accept="image/*" hidden /></label>
        </div>
        <p id="intro-error" class="error" hidden></p>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
